<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veer & Zara - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#fdf6f7;padding:16px;color:#4a2a2f}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(140,59,71,.15);border:1px solid #f0d0d5}
h1{font-family:'Great Vibes',cursive;color:#8c3b47;font-size:38px;text-align:center}
.sub{font-size:11px;letter-spacing:2px;text-align:center;color:#c8a45a;margin-bottom:18px}
label{font-size:11px;font-weight:600;letter-spacing:1px;color:#8c3b47;margin-top:12px;display:block;text-transform:uppercase}
input,textarea{width:100%;padding:11px 12px;margin-top:5px;border:1.5px solid #e9c5c9;border-radius:10px;font-family:Poppins;font-size:13px;outline:none;background:#fdf6f7}
input:focus,textarea:focus{border-color:#c8a45a;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.main{width:100%;padding:14px;background:linear-gradient(135deg,#8c3b47,#b55a65);color:#fff;border:none;border-radius:12px;margin-top:16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(140,59,71,.3)}
button.copy{width:100%;padding:12px;background:#fff;border:1.5px dashed #c8a45a;color:#8c3b47;border-radius:12px;margin-top:10px;font-weight:700;cursor:pointer}
#linkBox{display:none;margin-top:16px;background:#fffbe6;border:1.5px solid #f3d88e;padding:14px;border-radius:12px;word-break:break-all;font-size:12px}
.preview{margin-top:16px;background:#fdf6f7;border-radius:12px;padding:12px;text-align:center;border:1px solid #f0d0d5}
.preview b{font-family:Great Vibes;font-size:26px;color:#8c3b47}
</style>
</head>
<body>
<div class="card">
<h1>Veer & Zara</h1>
<div class="sub">ADMIN PANEL - WOW FINAL V2</div>

<label>Groom Name</label>
<input id="groom" value="Veer">
<label>Bride Name</label>
<input id="bride" value="Zara">

<div class="grid">
<div><label>Groom Parents</label><input id="groomP" value="Mr. & Mrs. Kapoor"></div>
<div><label>Bride Parents</label><input id="brideP" value="Mr. & Mrs. Khan"></div>
</div>

<label>Venue Name</label>
<input id="vN" value="The Taj Mahal Palace">
<label>Venue Address</label>
<input id="vA" value="Apollo Bandar, Mumbai">
<div class="grid">
<div><label>Date</label><input id="date" value="12 Dec 2026"></div>
<div><label>Time</label><input id="time" value="7:00 PM Onwards"></div>
</div>

<label>Google Map Link (optional)</label>
<input id="map" placeholder="https://maps.google.com/...">

<button class="main" onclick="save()">💾 Save & Generate Shareable Link</button>

<div id="linkBox"></div>

<div class="preview">
<div style="font-size:10px;letter-spacing:2px;color:#c8a45a">LIVE PREVIEW</div>
<b id="prevName">Veer & Zara</b>
<div id="prevVenue" style="font-size:12px;margin-top:4px">The Taj Mahal Palace<br>Apollo Bandar, Mumbai</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
function collect(){
 return {groom:$('groom').value.trim(), bride:$('bride').value.trim(), groomP:$('groomP').value.trim(), brideP:$('brideP').value.trim(), vN:$('vN').value.trim(), vA:$('vA').value.trim(), date:$('date').value.trim(), time:$('time').value.trim(), map:$('map').value.trim()}
}
function save(){
 let d=collect();
 if(!d.groom||!d.bride){alert('Groom Bride name likho');return}
 localStorage.setItem('WOW_FINAL_V2', JSON.stringify(d));
 let code=btoa(encodeURIComponent(JSON.stringify(d)));
 let base=location.href.replace('admin.html','').split('?')[0];
 let link=base + '?d=' + code;
 $('linkBox').style.display='block';
 $('linkBox').innerHTML=`<b style="color:#8c3b47">✅ Saved! Ye link har kisi ko same data dikhayega:</b><br><br><div style="background:#fff;padding:8px;border-radius:8px;border:1px solid #eee">${link}</div><button class="copy" onclick="copyLink('${link}')">📋 Copy Link</button><button class="main" style="background:#25D366" onclick="window.open('${link}','_blank')">👁️ Open Invitation</button>`;
 updatePrev();
}
function copyLink(l){navigator.clipboard.writeText(l).then(()=>alert('Link Copied! ✅')); }
function updatePrev(){let d=collect(); $('prevName').innerText=d.groom+' & '+d.bride; $('prevVenue').innerHTML=d.vN+'<br>'+d.vA;}
['groom','bride','vN','vA'].forEach(id=>$(id).addEventListener('input',updatePrev));
// Load old
try{let old=JSON.parse(localStorage.getItem('WOW_FINAL_V2')||'null'); if(old){ for(let k in old){ if($(k)) $(k).value=old[k]; } updatePrev(); } }catch(e){}
</script>
</body>
</html>
