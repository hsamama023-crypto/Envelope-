<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Veer & Zara</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--dark:#8c3b47;--pink:#e9c5c9;--gold:#c8a45a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fdf6f7;font-family:'Poppins',sans-serif}

/* ===== GATE - PHOTO SAME ===== */
#gate{position:fixed;inset:0;background:#e9c5c9;display:flex;align-items:center;justify-content:center;z-index:9999;transition:transform 1s cubic-bezier(.77,0,.175,1)}
#gate.open{transform:translateY(-110%)}
.phone{width:360px;height:740px;position:relative;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);background:#d9aab0;cursor:pointer}

/* Textured envelope - Photo jesa emboss */
.env{position:absolute;inset:0;background-color:#d6a4ac;
background-image:
radial-gradient(circle at 15% 20%, rgba(255,255,255,.25) 1px, transparent 1.5px),
radial-gradient(circle at 80% 30%, rgba(255,255,255,.2) 1px, transparent 1.5px),
url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 50 Q35 30 45 45 Q50 60 30 50 M100 20 Q110 10 120 25 Q115 40 100 20 M160 80 Q165 60 175 75 Q170 95 160 80 M40 150 Q45 130 55 145 Q50 165 40 150 M120 140 Q125 120 135 135 Q130 155 120 140' fill='none' stroke='%23b07a82' stroke-width='.5' opacity='.35'/%3E%3C/svg%3E");
}
.env:before{content:'';position:absolute;top:0;left:0;right:0;height:52%;background:linear-gradient(180deg, rgba(255,255,255,.15), transparent);border-bottom:1px solid rgba(255,255,255,.2)}

/* Diagonal fold - Photo jesa */
.fold{position:absolute;bottom:0;right:0;width:100%;height:45%;background:#c9989f;clip-path:polygon(40% 0,100% 0,100% 100%,0 100%);border-top:1.5px solid rgba(255,255,255,.3);box-shadow:inset 0 8px 20px rgba(0,0,0,.08)}

/* Golden Wax Seal */
.seal{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:88px;height:88px;background:radial-gradient(circle at 30% 30%, #f3d68b, #c8a45a 40%, #9c7a3a 100%);border-radius:50%;box-shadow:0 4px 0 #9c7a3a, 0 8px 20px rgba(0,0,0,.3), inset 0 2px 3px rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;border:2px solid #b38f4a;z-index:10}
.seal:after{content:'';position:absolute;inset:6px;border:1px dashed #7a5a2e;border-radius:50%;opacity:.6}
.seal b{font-family:'Cormorant Garamond';font-size:15px;line-height:1.1;color:#4a3018;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.4)}

/* YOU ARE INVITED - Bottom */
.you{position:absolute;bottom:85px;left:0;right:0;text-align:center;z-index:5}
.you svg{width:160px;opacity:.6}
.you p{font-family:'Cormorant Garamond';letter-spacing:4px;font-size:11px;color:#5a2e36;margin-top:4px;font-weight:600}

/* Urdu Button */
.urdu{position:absolute;bottom:18px;left:14px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);padding:5px 12px;border-radius:20px;font-size:11px;color:#8c3b47;box-shadow:0 2px 8px rgba(0,0,0,.1)}

/* ===== INSIDE CONTENT ===== */
#content{padding:0;opacity:0;transition:.8s}
#content.show{opacity:1}
.hero{height:100vh;background:linear-gradient(180deg, #fdf6f7 0%, #f9e8ea 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:85px;position:relative;overflow:hidden}
.hero:before{content:'❦';position:absolute;top:20px;font-size:40px;color:#e9c5c9;opacity:.6;letter-spacing:10px}
.floral{position:absolute;width:220px;height:220px;opacity:.18;background:radial-gradient(circle, #d6a4ac 2px, transparent 2.5px);background-size:22px 22px;mask:radial-gradient(circle, black 40%, transparent 70%)}
.floral.l{top:60px;left:-30px}.floral.r{top:60px;right:-30px;transform:scaleX(-1)}
.orn{margin-top:15px;opacity:.5}
.hero h4{font-family:'Cormorant Garamond';letter-spacing:5px;font-size:10px;color:#b55a65;margin-top:35px}
.hero h1{font-family:'Great Vibes';font-size:68px;color:var(--dark);margin-top:42px;line-height:.9;text-align:center;font-weight:400}
.hero h1 span{font-size:34px;display:block;margin:6px 0;color:#c27a85}
.hero .parent{font-size:11px;color:#9a7a80;margin-top:18px;text-align:center;line-height:1.6}
.count{margin-top:28px;display:flex;gap:10px}
.count div{background:#fff;border:1px solid #f2d5d8;border-radius:12px;padding:10px 14px;text-align:center;min-width:56px;box-shadow:0 4px 12px rgba(0,0,0,.04)}
.count b{font-family:'Cormorant Garamond';font-size:20px;color:var(--dark);display:block}
.count span{font-size:8px;letter-spacing:1px;color:#b18d91}

/* Sections - Andar graphics */
.section{padding:38px 18px;background:#fff;margin:12px;border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.04);border:1px solid #f9e8ea;position:relative;overflow:hidden}
.section:before{content:'';position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle, #f9e8ea 1px, transparent 1.5px);background-size:14px 14px;opacity:.8}
.sec-title{font-family:'Great Vibes';font-size:34px;color:var(--dark);text-align:center}
.sec-line{width:40px;height:1px;background:#e9c5c9;margin:10px auto 18px}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate" onclick="openCard()">
  <div class="phone">
    <div class="env"></div>
    <div class="fold"></div>
    <div class="seal"><b>Tap<br>to<br>open</b></div>
    <div class="you">
      <svg viewBox="0 0 200 30"><path d="M10 15 Q50 5 100 15 Q150 25 190 15" fill="none" stroke="#6b3a42" stroke-width=".6"/><text x="100" y="28" text-anchor="middle" font-size="7" letter-spacing="3" fill="#5a2e36">✦ YOU ARE INVITED ✦</text></svg>
    </div>
    <div class="urdu">● Urdu</div>
  </div>
</div>

<!-- CONTENT -->
<div id="content">
  <div class="hero">
    <div class="floral l"></div><div class="floral r"></div>
    <h4>WEDDING INVITATION</h4>
    <!-- Veer Zara thora neeche - 42px margin -->
    <h1 id="hName">Veer <span>&</span> Zara</h1>
    <div class="parent" id="hParent">Son of Mr. Ahmed & Mrs. Aliya<br>Daughter of Mr. Abbas & Mrs. Rubina</div>
    <div class="count" id="countdown"></div>
    <div class="orn">❧</div>
  </div>

  <div class="section">
    <div class="sec-title">Venue</div><div class="sec-line"></div>
    <p id="vName" style="text-align:center;font-weight:600;color:#8c3b47">The Taj Mahal Palace</p>
    <p id="vAddr" style="text-align:center;font-size:12px;color:#8a7a7d;margin-top:6px">Apollo Bandar, Colaba, Mumbai</p>
    <a id="vMap" href="#" target="_blank" style="display:block;text-align:center;margin-top:14px;color:#b55a65;font-size:12px">View on Map →</a>
  </div>
</div>

<script>
function openCard(){document.getElementById('gate').classList.add('open');setTimeout(()=>{document.getElementById('content').classList.add('show')},600); window.scrollTo(0,0)}
// Countdown
let wedding = new Date('2026-09-20'); let savedData = JSON.parse(localStorage.getItem('WOW_FINAL_V2')||'{}'); if(savedData.wDate) wedding=new Date(savedData.wDate);
function tick(){let now=new Date();let d=wedding-now;if(d<0)d=0;let days=Math.floor(d/86400000);let hrs=Math.floor(d%86400000/3600000);let mins=Math.floor(d%3600000/60000);let secs=Math.floor(d%60000/1000);document.getElementById('countdown').innerHTML=`<div><b>${days}</b><span>DAYS</span></div><div><b>${hrs}</b><span>HRS</span></div><div><b>${mins}</b><span>MINS</span></div><div><b>${secs}</b><span>SECS</span></div>`}setInterval(tick,1000);tick();
// Admin data load
if(savedData.groom){document.getElementById('hName').innerHTML=`${savedData.groom} <span>&</span> ${savedData.bride}`; document.getElementById('hParent').innerHTML=`${savedData.gP}<br>${savedData.bP}`; document.getElementById('vName').innerText=savedData.vN; document.getElementById('vAddr').innerText=savedData.vA; document.getElementById('vMap').href=savedData.vM}
</script>
</body>
</html>
