<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Veer & Zara</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#ece9e6;font-family:'Poppins',sans-serif}

#gate{
 position:fixed;inset:0;z-index:9999;
 background:radial-gradient(ellipse at center, #f3efeb 0%, #e8e3de 100%);
 display:flex;align-items:center;justify-content:center;
 perspective:1600px;
}
#gate.hide{transform:translateY(-130%);transition:1.2s cubic-bezier(.77,0,.175,1)}

.invitation{
 width:335px;height:505px;position:relative;
 transform-style:preserve-3d;
}

/* Pink body - tumhari image */
.body{
 position:absolute;inset:0;border-radius:14px;overflow:hidden;
 box-shadow:0 20px 60px rgba(60,20,25,.3);z-index:1;
}
.body img{width:100%;height:100%;object-fit:cover}

/* Top Flap - jo open hoga video ki tarah */
.flap{
 position:absolute;top:0;left:0;width:100%;height:48%;z-index:4;
 transform-origin:top center;transform-style:preserve-3d;
 transition:transform 1.1s cubic-bezier(.77,0,.175,1);
}
.flap::before{
 content:'';position:absolute;inset:0;
 background: #d8a8ae;
 background-image:url('envelope.jpg');
 background-size:cover;background-position:top;
 clip-path:polygon(0 0, 100% 0, 50% 78%);
 box-shadow:0 8px 20px rgba(0,0,0,.15);
}
#gate.opening .flap{transform:rotateX(-180deg)}

/* Dark inside after flap open */
.inside-shadow{
 position:absolute;top:15%;left:5%;right:5%;bottom:25%;z-index:2;
 background:radial-gradient(ellipse at center, #3a1a20 0%, #1a0a0d 70%);
 border-radius:8px;opacity:0;transition:opacity .6s .3s;
}
#gate.opening .inside-shadow{opacity:1}

/* WHITE LUXURY LIGHT - VIDEO JESI */
.white-light{
 position:absolute;left:50%;top:42%;width:8px;height:8px;z-index:3;
 background:radial-gradient(circle, #fff 0%, #fffbe6 15%, #ffeaa0 35%, rgba(255,255,255,0) 70%);
 border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;
 box-shadow:0 0 20px 10px rgba(255,255,255,.95), 0 0 60px 30px rgba(255,240,180,.8), 0 0 120px 60px rgba(200,164,90,.5);
}
#gate.opening .white-light{animation:lightVideo 2.2s cubic-bezier(.16,1,.3,1) .5s forwards}
@keyframes lightVideo{
 0%{transform:translate(-50%,-50%) scale(0);opacity:0}
 20%{opacity:1}
 40%{transform:translate(-50%,-50%) scale(2.5);opacity:1}
 75%{transform:translate(-50%,-50%) scale(6);opacity:.9}
 100%{transform:translate(-50%,-50%) scale(10);opacity:.6}
}

/* Rays */
.ray{
 position:absolute;left:50%;top:42%;width:1px;height:0;background:linear-gradient(to bottom, rgba(255,255,255,.9), transparent);
 z-index:3;transform-origin:top center;opacity:0;
}
#gate.opening .ray{animation:rayAnim 1.8s ease-out .7s forwards}
@keyframes rayAnim{
 0%{height:0;opacity:0}
 30%{height:220px;opacity:.9}
 100%{height:340px;opacity:0}
}

/* Inner white card jo bahar aata hai */
.inner-card{
 position:absolute;left:7%;right:7%;bottom:8%;height:62%;z-index:2;
 background:linear-gradient(180deg, #fff 0%, #fff8f9 100%);
 border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 transform:translateY(65%);transition:transform 1.4s cubic-bezier(.16,1,.3,1) .9s;
}
#gate.opening .inner-card{transform:translateY(-4%)}
.inner-card h2{font-family:'Great Vibes';font-size:28px;color:#7a2e3a}
.inner-card p{font-size:8px;letter-spacing:2px;color:#c8a45a;margin-top:4px}

/* Seal */
.seal{
 position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);z-index:8;
 width:72px;height:72px;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 35% 30%, #f0d08a, #b8860b 40%, #7a5a1e);
 box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 2px 3px rgba(255,255,255,.5);
 display:flex;align-items:center;justify-content:center;
 transition:.2s;
}
.seal::after{content:'🌹';font-size:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.seal:active{transform:translate(-50%,-50%) scale(.92)}
#gate.opening .seal{animation:sealBreak .6s cubic-bezier(.77,0,.175,1) forwards}
@keyframes sealBreak{
 0%{transform:translate(-50%,-50%) scale(1)}
 30%{transform:translate(-50%,-50%) scale(1.25) rotate(-10deg)}
 100%{transform:translate(-50%,-50%) scale(0) rotate(180deg);opacity:0}
}

.tap-hint{
 position:absolute;bottom:14%;left:50%;transform:translateX(-50%);z-index:9;
 background:rgba(50,35,38,.85);backdrop-filter:blur(8px);
 color:#fff;padding:10px 22px;border-radius:28px;font-size:10px;letter-spacing:1.5px;
 box-shadow:0 6px 18px rgba(0,0,0,.3);animation:float 2s infinite;
 transition:.6s;
}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
#gate.opening .tap-hint{opacity:0}

/* Main Content after open */
#main{max-width:440px;margin:0 auto;background:#fff;display:none;height:100vh;overflow-y:auto}
#main.show{display:block;animation:fade .8s ease}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.hero{height:84vh;background:linear-gradient(to bottom, rgba(0,0,0,.1), rgba(0,0,0,.45)), url('https://images.unsplash.com/photo-1519741497674-611481863552?w=800') center/cover;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:white;text-align:center;padding:0 20px 80px}
.hero h1{font-family:'Great Vibes';font-size:68px;line-height:.85;margin-top:50px}
</style>
</head>
<body>

<div id="gate" onclick="startOpen()">
<div class="invitation" id="inv">
<div class="body"><img src="envelope.jpg"></div>
<div class="inside-shadow"></div>
<div class="white-light"></div>
<div class="ray" style="transform:translateX(-50%) rotate(0deg)"></div>
<div class="ray" style="transform:translateX(-50%) rotate(22deg)"></div>
<div class="ray" style="transform:translateX(-50%) rotate(-22deg)"></div>
<div class="ray" style="transform:translateX(-50%) rotate(45deg)"></div>
<div class="ray" style="transform:translateX(-50%) rotate(-45deg)"></div>

<div class="flap" id="flap"></div>

<div class="inner-card">
<h2>Veer & Zara</h2>
<p>YOU'RE INVITED</p>
</div>

<div class="seal" id="seal"></div>
<div class="tap-hint">✦ TAP SEAL TO OPEN ✦</div>
</div>
</div>

<div id="main">
<div class="hero">
<p style="font-size:10px;letter-spacing:2px">WE ARE HONORED TO WELCOME YOU TO THE<br>Wedding ceremony of</p>
<h1>Veer<br>&<br>Zara</h1>
</div>
<div style="padding:28px;text-align:center;color:#5a3a40;line-height:1.8;font-size:13px">
❦<br>We are honored to welcome you to Wedding ceremony of Veer & Zara<br>❦
<div style="margin-top:30px"><a href="#" style="background:#8c3b47;color:#fff;padding:12px 28px;border-radius:24px;text-decoration:none;font-size:12px">View Invitation</a></div>
</div>
</div>

<script>
let opened=false;
function startOpen(){
 if(opened) return;
 opened=true;
 let g=document.getElementById('gate');
 g.classList.add('opening');
 if(navigator.vibrate) navigator.vibrate([50,30,80]);
 setTimeout(()=>{
  g.classList.add('hide');
  setTimeout(()=>{
   g.style.display='none';
   document.body.style.overflow='auto';
   document.getElementById('main').classList.add('show');
  },1000);
 },2400);
}
</script>
</body>
</html>
