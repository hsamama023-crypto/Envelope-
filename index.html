<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Video Editor</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080b0e;
    color: white;
    font-family: Arial, sans-serif;
}

.editor {
    width: 100%;
    max-width: 500px;
    height: 100dvh;
    margin: auto;
    background: #080b0e;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.top {
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px;
    background: #080b0e;
    z-index: 2;
}

.tool {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #171c20;
    display: grid;
    place-items: center;
    font-size: 25px;
    cursor: pointer;
}

.timeline {
    position: absolute;
    top: 108px;
    left: 4%;
    width: 92%;
    height: 48px;
    display: flex;
    border: 2px solid white;
    border-radius: 5px;
    overflow: hidden;
    z-index: 3;
}

.timeline img {
    width: 10%;
    height: 100%;
    object-fit: cover;
    border-right: 1px solid white;
}

.preview {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: linear-gradient(140deg, #91a95c, #526b36);
    display: flex;
    align-items: center;
    justify-content: center;
}

.caption {
    position: absolute;
    top: 75px;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 1px 2px 5px black;
}

.phone {
    width: 62%;
    height: 65%;
    background: #15191d;
    border: 5px solid #16191c;
    border-radius: 24px;
    transform: rotate(8deg);
    padding: 7px;
    box-shadow: 0 8px 25px #0008;
}

.phone-screen {
    height: 100%;
    border-radius: 15px;
    background: #e8bfc5;
    color: #75504f;
    position: relative;
    overflow: hidden;
}

.phone-header {
    height: 45px;
    background: #171c24;
    color: white;
    padding: 14px 10px;
    font-size: 11px;
}

.envelope {
    margin: 30px auto;
    width: 90%;
    height: 65%;
    background:
      radial-gradient(circle, #ffffff30 1px, transparent 3px),
      #e9c3c8;
    background-size: 14px 14px;
    clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%);
    position: relative;
}

.seal {
    position: absolute;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    height: 65px;
    width: 65px;
    border-radius: 50%;
    background: #bb8531;
    border: 5px double #755020;
    display: grid;
    place-items: center;
    color: #503314;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
}

.phone-footer {
    text-align: center;
    font-family: Georgia, serif;
    font-size: 12px;
    margin-top: -25px;
}

.sound {
    position: absolute;
    left: 15px;
    bottom: 15px;
    background: #3339;
    padding: 9px;
    border-radius: 50%;
}

.ask {
    margin: 12px 10px;
    background: #1c2428;
    border-radius: 30px;
    height: 55px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
}

.ask span {
    font-size: 23px;
}

.ask input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
}

.ask input::placeholder {
    color: white;
}

.bottom {
    height: 75px;
    background: #0d141a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
}

.meta {
    background: #151d24;
    border-radius: 20px;
    padding: 10px 15px;
    font-size: 14px;
}

.check {
    background: #16c76a;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: black;
    font-size: 27px;
    cursor: pointer;
}

.home {
    width: 125px;
    height: 4px;
    background: white;
    border-radius: 10px;
    margin: 7px auto;
}
</style>
</head>

<body>

<div class="editor">

    <div class="top">
        <div class="tool" onclick="alert('Close editor')">×</div>
        <div class="tool" onclick="downloadImage()">♧</div>
        <div class="tool">▣</div>
        <div class="tool">Aa</div>
        <div class="tool">✎</div>
    </div>

    <div class="timeline">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=100">
        <img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=100">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=100">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100">
        <img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=100">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=100">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100">
        <img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=100">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=100">
    </div>

    <div class="preview">

        <div class="caption">
            Top saying "WOW!" 🤍
        </div>

        <div class="phone">
            <div class="phone-screen">

                <div class="phone-header">
                    5:26 &nbsp;&nbsp; Veer & Zar...
                </div>

                <div class="envelope"></div>

                <div class="seal">
                    Thank<br> You
                </div>

                <div class="phone-footer">
                    YOU ARE INVITED
                </div>

            </div>
        </div>

        <div class="sound">🔊</div>

    </div>

    <div class="ask">
        <span>▧</span>
        <input type="text" placeholder="Ask about this...">
    </div>

    <div class="bottom">
        <div class="meta">
            Meta AI 🔵
        </div>

        <div class="check" onclick="alert('Confirmed!')">
            ✓
        </div>
    </div>

    <div class="home"></div>

</div>

<script>
function downloadImage() {
    alert("Download option clicked!");
}
</script>

</body>
</html>
